name: Build and deploy

on:
  workflow_dispatch:

  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Build Plugin
        run: |
          mkdir -p dist
          
          # تجميع ملفات TypeScript مباشرة إلى dist/index.js
          esbuild src/index.ts \
            --bundle \
            --outfile=dist/index.js \
            --format=esm \
            --target=es2021 \
            --external:@vendetta/* \
            --external:@revenge/* \
            --external:react \
            --external:react-native

          # نسخ manifest وتعديل المسار ليعمل في البناء
          cp manifest.json dist/manifest.json
          sed -i 's/"src\/index.ts"/"index.js"/g' dist/manifest.json

      - name: Build 404 page
        run: |
          printf -- "---\npermalink: /404.html\n---\n" > dist/404.md
          printf -- "> **Note:** You accessed a link that returned a 404, probably by clicking one of the plugin links. You're supposed to copy the link address and add it into Revenge/Bunny/Vendetta.\n\n" >> dist/404.md
          if [ -f README.md ]; then cat README.md >> dist/404.md; fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: true
