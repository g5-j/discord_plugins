indexxd and deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install esbuild and jq
        run: sudo apt-get install -y jq && npm install -g esbuild

      - name: Build Plugin
        run: |
          mkdir -p dist/QuickSoundboard
          
          # تجميع الكود بصيغة cjs ودعم ملفات JSX / TSX
          esbuild QuickSoundboard/src/index.tsx \
            --bundle \
            --outfile=dist/QuickSoundboard/index.js \
            --format=cjs \
            --target=es2018 \
            --jsx=transform \
            --loader:.tsx=tsx \
            --external:@vendetta \
            --external:@vendetta/* \
            --external:@revenge \
            --external:@revenge/* \
            --external:react \
            --external:react-native

          # حساب SHA-256 Hash لملف index.js الناتج
          HASH=$(sha256sum dist/QuickSoundboard/index.js | cut -d' ' -f1)

          # تحديث manifest.json وتعديل المسار وإضافة الـ hash
          jq --arg hash "$HASH" '.main = "index.js" | .hash = $hash' QuickSoundboard/manifest.json > dist/QuickSoundboard/manifest.json

      - name: Build 404 page
        run: |
          printf -- "---\npermalink: /404.html\n---\n" > dist/404.md
          printf -- "> **Note:** You accessed a link that returned a 404.\n\n" >> dist/404.md
          if [ -f README.md ]; then cat README.md >> dist/404.md; fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: true
