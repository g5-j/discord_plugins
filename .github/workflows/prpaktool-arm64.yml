name: PR Pak Tool ARM64 Android Build

on:
  push:
    branches:
      - work/prpaktool-arm64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK package
        run: sdkmanager "ndk;27.2.12479018"

      - name: Prepare toolchain
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Fetch PR-Pak-Tool source
        run: git clone --depth 1 https://github.com/0xPrince/PR-Pak-Tool.git prpak-src

      - name: Patch Android and ARM64 compatibility
        working-directory: prpak-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("Src/jni/Utils/Utils.h")
          s = p.read_text()
          old = "return *(type*)(src);"
          new = "type value{};\n\t\t\tMemCopy(&value, src, sizeof(type));\n\t\t\treturn value;"
          assert old in s, "ReadBuffer source pattern not found"
          p.write_text(s.replace(old, new, 1))

          p = Path("Src/jni/Macros.h")
          s = p.read_text()
          old = "#define offset_of(s,m) ((unsigned int)&(((s*)0)->m))"
          assert old in s, "offset_of source pattern not found"
          s = s.replace(old, "#define offset_of(s,m) __builtin_offsetof(s,m)", 1)
          pattern = r'#include <assert\.h>\s*#define __ASSERT\(expression,msg\).*?_CRT_WIDE\(#msg\).*?\(unsigned\)\(__LINE__\).*?\)\)'
          s, count = re.subn(pattern, '#include <assert.h>\n#define __ASSERT(expression,msg) assert(expression)', s, count=1, flags=re.S)
          assert count == 1, "Windows-only __ASSERT implementation not found"
          p.write_text(s)

          p = Path("Src/jni/EntryPoint/Handler/PakHandler.hpp")
          s = p.read_text()
          old = '#include "../Unpacker/Unpacker.h"'
          assert old in s, "PakHandler Unpacker include not found"
          p.write_text(s.replace(old, '#include "../../Unpacker/UnPacker.h"', 1))

          p = Path("Src/jni/Application.mk")
          s = p.read_text().replace("APP_ABI := x86 armeabi-v7a", "APP_ABI := arm64-v8a")
          assert "APP_ABI := arm64-v8a" in s
          p.write_text(s)

          p = Path("Src/jni/Android.mk")
          s = p.read_text()
          start = s.index("include $(CLEAR_VARS)\nLOCAL_MODULE := liboo2core")
          end = s.index("include $(CLEAR_VARS)\nLOCAL_MODULE := libzlib", start)
          s = s[:start] + s[end:]
          s = s.replace("LOCAL_CPPFLAGS += -pie -fPIE", "LOCAL_CPPFLAGS += -DNO_OODLE -pie -fPIE")
          s = s.replace("LOCAL_STATIC_LIBRARIES := libcrypto liboo2core libzlib libzstd",
                        "LOCAL_STATIC_LIBRARIES := libcrypto libzlib libzstd")
          p.write_text(s)
          PY

      - name: Build OpenSSL for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch openssl-3.3.2 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          ./Configure android-arm64 no-shared no-tests
          make -j2 build_libs
          mkdir -p "$GITHUB_WORKSPACE/prpak-src/Src/jni/include/lib/arm64-v8a/openssl"
          cp libcrypto.a "$GITHUB_WORKSPACE/prpak-src/Src/jni/include/lib/arm64-v8a/openssl/"
          cp -a include/openssl "$GITHUB_WORKSPACE/prpak-src/Src/jni/include/"

      - name: Build zlib for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git zlib-src
          cd zlib-src
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export AR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export RANLIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          ./configure --static
          make -j2
          mkdir -p "$GITHUB_WORKSPACE/prpak-src/Src/jni/include/lib/arm64-v8a/zlib"
          cp libz.a "$GITHUB_WORKSPACE/prpak-src/Src/jni/include/lib/arm64-v8a/zlib/libzlib.a"
          cp zlib.h zconf.h "$GITHUB_WORKSPACE/prpak-src/Src/jni/include/"

      - name: Build Zstandard for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.5.6 https://github.com/facebook/zstd.git zstd-src
          cmake -S zstd-src/build/cmake -B zstd-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
            -DZSTD_BUILD_SHARED=OFF -DZSTD_BUILD_STATIC=ON \
            -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_TESTS=OFF
          cmake --build zstd-build --config Release -j2
          mkdir -p prpak-src/Src/jni/include/lib/arm64-v8a/zstd
          find zstd-build -name 'libzstd.a' -exec cp {} prpak-src/Src/jni/include/lib/arm64-v8a/zstd/libzstd.a \;
          cp zstd-src/lib/zstd.h zstd-src/lib/zstd_errors.h prpak-src/Src/jni/include/

      - name: Compile PR Pak Tool
        working-directory: prpak-src
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Src/jni/Android.mk \
            NDK_APPLICATION_MK=Src/jni/Application.mk \
            NDK_OUT="$RUNNER_TEMP/obj" \
            NDK_LIBS_OUT="$RUNNER_TEMP/libs" \
            V=1
          find "$RUNNER_TEMP/libs" -type f -name PRPakTool -exec cp {} "$GITHUB_WORKSPACE/PRPakTool-Android-arm64" \;
          test -s "$GITHUB_WORKSPACE/PRPakTool-Android-arm64"
          file "$GITHUB_WORKSPACE/PRPakTool-Android-arm64"

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: PRPakTool-Android-arm64
          path: PRPakTool-Android-arm64
          if-no-files-found: error
          retention-days: 14
